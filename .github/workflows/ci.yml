name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist

  dashboard:
    # Vorschau des Artefakts mit synthetischen Daten: Skriptfehler, Überlauf am Handy, fehlende Abschnitte (#68), Barrierefreiheit mit axe-core (#211)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npx vite-node dev/mock-dashboard.ts > ../artifact/dev/mock-dashboard.json
        working-directory: worker
      - run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3 && npx playwright install --with-deps chromium
      - run: node artifact/dev/preview.mjs artifact/dev/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: artifact/dev/out/*.png
